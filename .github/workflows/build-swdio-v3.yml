name: Build ESP32-S3 CMSIS-DAP SWDIO V3 (experimental)

on:
  push:
    paths:
      - .github/workflows/build-swdio-v3.yml
      - scripts/apply-swdio-turnaround-v3.py
      - scripts/apply-nreset-gpio7.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify 8MB GPIO7 + SWDIO turnaround (no flashing)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v5.4

    steps:
      - name: Checkout patch scripts
        uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false

      - name: Checkout pinned official Espressif USB Bridge
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-usb-bridge
          ref: 09a160432555ba936a47a1b32ca7fbf17922d709
          path: bridge
          persist-credentials: false

      - name: Apply guarded V2 GPIO7 and experimental V3 SWDIO patches
        run: |
          python3 -m py_compile builder/scripts/apply-nreset-gpio7.py builder/scripts/apply-swdio-turnaround-v3.py
          python3 builder/scripts/apply-nreset-gpio7.py bridge/components/debug_probe/DAP/Config/DAP_config.h
          python3 builder/scripts/apply-swdio-turnaround-v3.py bridge/components/debug_probe
          git -C bridge diff --check
          grep -qF 'GPIO_MODE_INPUT_OUTPUT_OD' bridge/components/debug_probe/DAP/Config/DAP_config.h
          grep -qF 'gpio_get_level(GPIO_NUM_7)' bridge/components/debug_probe/DAP/Config/DAP_config.h
          grep -qF '.out_en = 0, // SWDIO must release' bridge/components/debug_probe/debug_gpio.c
          grep -qF 'gpio_ll_set_level(dedic_gpio_dev, GPIO_SWDIO' bridge/components/debug_probe/debug_gpio.h

      - name: Build 8MB CMSIS-DAP SWD experimental V3
        working-directory: bridge
        env:
          SDKCONFIG_DEFAULTS: "sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.swd.defaults;sdkconfig.board-8mb.defaults"
        run: |
          . "$IDF_PATH/export.sh"
          printf '%s\n' 'CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y' > sdkconfig.board-8mb.defaults
          idf.py build
          grep -qx 'CONFIG_IDF_TARGET="esp32s3"' sdkconfig
          grep -qx 'CONFIG_DEBUG_PROBE_IFACE_SWD=y' sdkconfig
          grep -qx 'CONFIG_DEBUG_PROBE_IFACE_NAME="CMSIS-DAP"' sdkconfig
          grep -qx 'CONFIG_DEBUG_PROBE_GPIO_TMS=8' sdkconfig
          grep -qx 'CONFIG_DEBUG_PROBE_GPIO_TCK=10' sdkconfig
          grep -qx 'CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y' sdkconfig
          grep -qx 'CONFIG_ESPTOOLPY_FLASHSIZE="8MB"' sdkconfig
          idf.py merge-bin -o orca-swd-esp32s3-swdio-v3-experimental.bin
          test -s build/orca-swd-esp32s3-swdio-v3-experimental.bin
          sha256sum build/orca-swd-esp32s3-swdio-v3-experimental.bin

      - name: Upload experimental artifact only (never flash)
        uses: actions/upload-artifact@v4
        with:
          name: orca-swd-esp32s3-8mb-swdio-v3-experimental
          path: bridge/build/orca-swd-esp32s3-swdio-v3-experimental.bin
          if-no-files-found: error
